<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="#000" opacity="0.5"/>
  <!-- Modal card -->
  <rect x="120" y="30" width="400" height="340" rx="16" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Close button -->
  <circle cx="490" cy="58" r="12" fill="#222"/>
  <line x1="485" y1="53" x2="495" y2="63" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="495" y1="53" x2="485" y2="63" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Title -->
  <text x="320" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f0f0f0">Create New Matter</text>
  <text x="320" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888">Fill in the details below</text>
  <!-- Matter Name field -->
  <text x="150" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#aaa">Matter Name</text>
  <rect x="145" y="142" width="350" height="36" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="159" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">e.g. Smith v. Johnson</text>
  <!-- Client field -->
  <text x="150" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#aaa">Client</text>
  <rect x="145" y="206" width="170" height="36" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="159" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">Select client...</text>
  <!-- Type field -->
  <text x="340" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#aaa">Type</text>
  <rect x="325" y="206" width="170" height="36" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="339" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">Litigation</text>
  <!-- Description field -->
  <text x="150" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#aaa">Description</text>
  <rect x="145" y="270" width="350" height="52" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="159" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">Brief description...</text>
  <!-- Buttons -->
  <rect x="295" y="336" width="90" height="34" rx="8" fill="none" stroke="#333" stroke-width="1"/>
  <text x="340" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#ccc">Cancel</text>
  <rect x="395" y="336" width="100" height="34" rx="8" fill="#f0f0f0"/>
  <text x="445" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">Create</text>
</svg>
