<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="400" fill="#0a0a0a"/>
  <!-- Backdrop overlay -->
  <rect width="640" height="400" fill="#000" opacity="0.5"/>
  <!-- Modal card -->
  <rect x="145" y="50" width="350" height="300" rx="16" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Close button -->
  <circle cx="465" cy="78" r="12" fill="#222"/>
  <line x1="460" y1="73" x2="470" y2="83" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="470" y1="73" x2="460" y2="83" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Title -->
  <text x="320" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f0f0f0">Sign In</text>
  <text x="320" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888">Welcome back to your account</text>
  <!-- Email field -->
  <text x="175" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#aaa">Email</text>
  <rect x="170" y="168" width="300" height="38" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="184" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">you@example.com</text>
  <!-- Password field -->
  <text x="175" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#aaa">Password</text>
  <rect x="170" y="234" width="300" height="38" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="184" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">••••••••</text>
  <!-- Sign in button -->
  <rect x="170" y="290" width="300" height="40" rx="8" fill="#f0f0f0"/>
  <text x="320" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a">Sign In</text>
</svg>
